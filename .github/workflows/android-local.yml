name: Manga Rafı APK derle

on:
  push:
    branches: [main]
    paths: ['android-local/**', 'lib/url.js', '.github/workflows/android-local.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK derle
        working-directory: android-local
        run: |
          set -o pipefail
          cp ../lib/url.js app/src/main/assets/web/url.js
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build.log
          cp app/build/outputs/apk/release/app-release.apk ../manga-rafi.apk

      - name: İndirme bağlantısına koy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: manga-rafi
          name: Manga Rafı uygulaması
          body: |
            Hesap gerektirmeyen, verileri telefonda tutan manga takip uygulaması.
            Telefona indirip kur; yeni sürüm eskisinin üstüne kurulur.
            Sürüm: 1.0.${{ github.run_number }}
          make_latest: false
          files: manga-rafi.apk

      - name: Hata kaydını sakla
        if: failure()
        run: |
          git config user.name "manga-takip-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tail -n 400 build.log > /tmp/last-build.log || echo "kayıt yok" > /tmp/last-build.log
          git checkout --orphan build-logs
          git rm -rf --cached . -q
          cp /tmp/last-build.log last-build.log
          echo "(Manga Rafı derlemesi)" >> last-build.log
          git add last-build.log
          git commit -m "Son derleme hatası"
          git push -f origin build-logs
