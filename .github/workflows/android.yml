name: Uygulama APK derle

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK derle
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build.log
          cp app/build/outputs/apk/release/app-release.apk ../manga-takip.apk

      - name: Sürüm bilgisi (uygulama içi güncelleme için)
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          n = int(os.environ["GITHUB_RUN_NUMBER"])
          msg = subprocess.check_output(["git", "log", "-1", "--format=%s"]).decode().strip()
          json.dump({"versionCode": n, "versionName": "1.0.%d" % n, "notes": msg,
                     "url": "https://github.com/yildizkumlamaboya-pixel/Manga-takip/releases/download/apk/manga-takip.apk"},
                    open("version.json", "w", encoding="utf-8"), ensure_ascii=False)
          PY
          cat version.json

      - name: İndirme bağlantısına koy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Manga Takip uygulaması
          body: |
            Android uygulaması. Telefona indirip kur; yeni sürüm eskisinin üstüne kurulur.
            Sürüm: 1.0.${{ github.run_number }}
          make_latest: true
          files: |
            manga-takip.apk
            version.json

      - name: Hata kaydını sakla
        if: failure()
        run: |
          git config user.name "manga-takip-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tail -n 400 build.log > /tmp/last-build.log || echo "kayıt yok" > /tmp/last-build.log
          git checkout --orphan build-logs
          git rm -rf --cached . -q
          cp /tmp/last-build.log last-build.log
          git add last-build.log
          git commit -m "Son derleme hatası"
          git push -f origin build-logs
